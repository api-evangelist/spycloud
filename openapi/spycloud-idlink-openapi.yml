        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /query/usernames/{username}:
    get:
      summary: Get records by username
      description: ''
      operationId: idl-get-records-by-username
      parameters:
      - name: username
        in: path
        description: The username you wish to search for.
        schema:
          type: string
        required: true
      - name: max_depth
        in: query
        description: Options for depth are 1 - 4. 1 meaning a normal query, 2 meaning a normal query and one additional pivot,
          and so on.
        required: true
        schema:
          type: integer
          format: int32
      - name: output_format
        in: query
        description: '"json" or "json-graph-spec"'
        required: true
        schema:
