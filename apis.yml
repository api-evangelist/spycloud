aid: spycloud
name: SpyCloud
description: 'SpyCloud is an Austin, Texas based identity threat protection company that operates one of the largest
  repositories of recaptured darknet data — breach records, infostealer malware logs, phishing captures and combolists
  — and exposes it programmatically through a family of high-volume REST APIs. Security, fraud, identity and investigations
  teams query recaptured credentials, session cookies, exposed PII and infected-device telemetry to prevent account
  takeover, ransomware, session hijacking and online fraud. The public API surface spans nine separately-licensed
  products: Enterprise (Employee) ATO Prevention, Consumer ATO Prevention, Cybercrime Investigations, Data Partnership,
  IDLink identity correlation, Compromised Credit Card, Prospecting, NIST Password check, and Session Identity Protection.
  All are REST/JSON, authenticated with an x-api-key header, IP allow-listed, cursor-paginated at 1,000 records
  per page, and backed by a 99.9% uptime SLA.'
url: https://raw.githubusercontent.com/api-evangelist/spycloud/refs/heads/main/apis.yml
